<div class="scoreboard" id="scoreboard">
  <h3 class="scoreboard-title">Scoreboard</h3>
  <div class="scores">
    <div class="score-item score-x">
      <span class="score-label">X Wins</span>
      <span class="score-value">{{ scoreboard.xWins }}</span>
    </div>
    <div class="score-item score-draw">
      <span class="score-label">Draws</span>
      <span class="score-value">{{ scoreboard.draws }}</span>
    </div>
    <div class="score-item score-o">
      <span class="score-label">O Wins</span>
      <span class="score-value">{{ scoreboard.oWins }}</span>
    </div>
  </div>
</div>
